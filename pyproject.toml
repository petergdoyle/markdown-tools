[project]
name = "markdown-tools"
version = "0.1.0"
description = "A collection of Python CLI utilities for working with markdown files"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1",
    "markdown-it-py[plugins]>=3.0",
    "weasyprint>=60.0",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = ["BLE001"]  # Allow broad Exception catches — used intentionally in converter

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2pdf"]
